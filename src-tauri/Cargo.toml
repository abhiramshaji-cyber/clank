[package]
name = "clank-app"
version = "0.1.0"
description = "Clank Command Centre"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
notify = "8"
parking_lot = "0.12"
once_cell = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
